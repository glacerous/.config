;   To learn more about how to configure Polybar
;   go to https://github.com/polybar/polybar

include-file = ./include-modules.ini

[bar/main]
; Added a colon at the end to provide a fallback if MONITOR is unset
monitor = ${env:MONITOR:}

width = 100%
height = 36
offset-y = 0
bottom = false
fixed-center = true

padding-right = 2
module-margin-right = 1

;wm-restack = i3

; Ensure you run 'sudo locale-gen' after enabling this in /etc/locale.gen
locale = zh_CN.UTF-8
override-redirect = false

scroll-up = next
scroll-down = prev

enable-ipc = true

background = ${colors.bg}
foreground = ${colors.fg}

font-0 = "JetBrainsMono:style=Bold:size=10;3"
font-1 = "FontAwesome:size=12;3"
font-2 = "Material Icons Round:size=14;5"
font-3 = "Noto Sans CJK SC:style=Regular:size=10;3"
; Suggestion: Add a Chinese-compatible font here if characters look like boxes
; font-3 = "Noto Sans CJK SC:size=10;2"

include-file = ./modules.ini

cursor-click = pointer
cursor-scroll = ns-resize

[settings]
screenchange-reload = true


